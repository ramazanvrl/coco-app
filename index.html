<style>
/* Layout: phone-first agenda. Sticky header, one view at a time, bottom tab bar, bottom-sheet forms. */
:root{
  --bg:#F7F4FB; --surface:#FFFFFF; --ink:#2A2238; --muted:#6E6585; --line:#E6DEF2;
  --lilac:#9B7FD1; --lilac-deep:#6A4CAF; --lilac-soft:#EFE8FB; --on-lilac:#FFFFFF;
  --danger:#C4513F; --ok:#3F8F6E;
  --t-ders:#7C5CC4; --t-pilates:#C26BB2; --t-ozel:#9B4F8E; --t-danisan:#3F9479; --t-sinav:#D2694F; --t-kisisel:#6F7FB0;
  --t-regl:#D23C5E; --t-manita:#E0703F;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r:14px; --hour:46px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16121E; --surface:#211B2C; --ink:#EEE8F8; --muted:#A79DBE; --line:#352C46;
  --lilac:#B69BEA; --lilac-deep:#CDB8F6; --lilac-soft:#2B2240; --on-lilac:#1B1526;
  --danger:#EE8A77; --ok:#6CC59E;
  --t-ders:#A98BEB; --t-pilates:#E191D2; --t-ozel:#CF84C1; --t-danisan:#62C3A2; --t-sinav:#F08D73; --t-kisisel:#93A3D6;
  --t-regl:#F07D97; --t-manita:#F4A272;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16121E; --surface:#211B2C; --ink:#EEE8F8; --muted:#A79DBE; --line:#352C46;
  --lilac:#B69BEA; --lilac-deep:#CDB8F6; --lilac-soft:#2B2240; --on-lilac:#1B1526;
  --danger:#EE8A77; --ok:#6CC59E;
  --t-ders:#A98BEB; --t-pilates:#E191D2; --t-ozel:#CF84C1; --t-danisan:#62C3A2; --t-sinav:#F08D73; --t-kisisel:#93A3D6;
  --t-regl:#F07D97; --t-manita:#F4A272;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
header.top .iconbtn{padding:5px}
header.top .iconbtn + .iconbtn{margin-left:-10px}
.logo{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.06em;color:var(--lilac-deep);display:flex;align-items:center;gap:8px;line-height:1}
.logo svg{width:40px;height:40px;flex:none;transform-origin:50% 90%;animation:bob 3.2s ease-in-out infinite}
@media (max-width:370px){header.top{gap:8px}.logo{font-size:22px;gap:6px}.logo svg{width:32px;height:32px}.top .date{font-size:12px}.pill{font-size:10.5px;padding:3px 7px}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.logo svg{animation:none}}
.top .date{color:var(--muted);font-size:13px;margin-left:auto;text-align:right;min-width:0}
.top .date .pill{max-width:100%}
.top .date .pill span{overflow:hidden;text-overflow:ellipsis}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:99px;background:var(--lilac-soft);color:var(--lilac-deep)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.pill[data-mode="ok"]{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.pill[data-mode="error"],.pill[data-mode="badkey"],.pill[data-mode="offline"]{background:color-mix(in srgb,var(--t-sinav) 14%,var(--surface));color:var(--t-sinav)}

h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:26px}
h2{font-size:18px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.divider{margin-top:28px;display:flex;align-items:center;gap:10px}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--lilac-soft);border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-top:6px}
.banner b{color:var(--lilac-deep)}
.banner .grow{flex:1 1 220px}

/* today stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .n{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:12px;color:var(--muted)}

/* event rows */
.list{display:flex;flex-direction:column;gap:8px}
.ev{--t:var(--lilac);display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:color-mix(in srgb,var(--t) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--t) 26%,var(--surface));border-radius:var(--r);padding:10px 12px}
.ev:hover{border-color:var(--t)}
.ev .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;line-height:1.2}
.ev .time span{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ev .body{min-width:0}
.ev .title{font-weight:700;overflow-wrap:anywhere}
.ev .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ev.now{box-shadow:0 0 0 2px var(--t) inset}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t);white-space:nowrap}
.ev.past{opacity:.6}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:14px}

/* tasks */
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.task .body{flex:1;min-width:0}
.task .title{font-weight:700;overflow-wrap:anywhere}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.check{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--lilac);background:transparent;display:grid;place-items:center;padding:0}
.check.on{background:var(--lilac);color:var(--on-lilac)}
.check svg{width:14px;height:14px}
.due{--t:var(--lilac-deep);flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--t) 14%,var(--surface));color:var(--t);font-variant-numeric:tabular-nums;white-space:nowrap}
.due.soon{--t:var(--t-sinav)}
.due.late{--t:var(--danger)}
.iconbtn{flex:none;border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px;display:grid;place-items:center}
.iconbtn:hover{background:var(--lilac-soft);color:var(--lilac-deep)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.35;pointer-events:none}

/* special days (birthdays, anniversaries) */
.sp-ic{--t:var(--t-manita);flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 16%,var(--surface));color:var(--t)}
.sp-ic svg{width:17px;height:17px}

/* cycle card */
.cyc{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:color-mix(in srgb,var(--t-regl) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--t-regl) 24%,var(--surface));border-radius:var(--r);padding:12px 14px}
.cyc .drop{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--t-regl) 18%,var(--surface));color:var(--t-regl)}
.cyc .drop svg{width:18px;height:18px}
.cyc .body{flex:1 1 180px;min-width:0}
.cyc .title{font-weight:700;font-size:16px}
.cyc .label{color:var(--t-regl)}
.cyc .actions{justify-content:flex-start}
.btn.regl{background:var(--t-regl);color:#fff}
:root[data-theme="dark"] .btn.regl{color:#1B1526}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.regl{color:#1B1526}}
.btn.regl-ghost{background:color-mix(in srgb,var(--t-regl) 14%,var(--surface));color:var(--t-regl)}
.cyrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;background:var(--bg);border-radius:12px;padding:8px}
.cyrow .n{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-weight:700}

/* water */
.water{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.glass{width:30px;height:38px;border:2px solid var(--lilac);border-radius:4px 4px 9px 9px;background:transparent;padding:0;position:relative;overflow:hidden}
.glass.on::after{content:"";position:absolute;inset:30% 0 0;background:var(--lilac)}
.water .amt{margin-left:6px;font-variant-numeric:tabular-nums;font-weight:700}

/* students */
.stu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.stu .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stu .name{font-weight:700;font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere;border:0;background:transparent;padding:0;text-align:left;color:var(--ink)}
.stu .name:hover{color:var(--lilac-deep)}
.stu .name small{display:block;font-weight:600;font-size:12.5px;color:var(--lilac-deep)}
.bar{height:8px;border-radius:99px;background:var(--lilac-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lilac);border-radius:99px}
.stu.warn .bar i{background:var(--t-sinav)}
.stu.out .bar i{background:var(--danger)}
.left{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--lilac-soft);color:var(--lilac-deep);font-variant-numeric:tabular-nums}
.stu.warn .left,.left.warn{background:color-mix(in srgb,var(--t-sinav) 16%,var(--surface));color:var(--t-sinav)}
.stu.out .left,.left.out{background:color-mix(in srgb,var(--danger) 16%,var(--surface));color:var(--danger)}
.health{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--t-sinav) 14%,var(--surface));color:var(--t-sinav)}
.alert{background:color-mix(in srgb,var(--t-sinav) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--t-sinav) 30%,var(--surface));border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.alert b{color:var(--t-sinav);display:block;font-size:12.5px}

/* key-value grid */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kv > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.sheet .kv > div{background:var(--bg);border-color:transparent}
.kv .k{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.kv .v{font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.kv a{color:var(--lilac-deep)}

/* notes */
.noteform{display:flex;flex-direction:column;gap:8px}
.noteform .actions input{width:auto;flex:0 1 170px}
.notes{display:flex;flex-direction:column;gap:8px}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 12px}
.sheet .note{background:var(--bg);border-color:transparent}
.note .body{flex:1;min-width:0}
.note time{display:block;font-size:12px;font-weight:700;color:var(--lilac-deep)}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.visits{display:flex;flex-wrap:wrap;gap:6px}
.visits span{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--bg);font-variant-numeric:tabular-nums}

/* buttons */
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;background:var(--lilac);color:var(--on-lilac);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--lilac-soft);color:var(--lilac-deep)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid color-mix(in srgb,var(--danger) 45%,var(--surface));color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.seg{display:inline-flex;background:var(--lilac-soft);border-radius:12px;padding:3px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--lilac-deep)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(40 20 70 / .12)}

/* calendar month */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar h2{flex:1;min-width:140px;text-transform:capitalize}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-block:4px;letter-spacing:.04em}
.day{aspect-ratio:1/1.05;max-width:100%;border:0;background:var(--surface);border-radius:11px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.day.other{background:transparent;color:var(--muted);font-weight:400}
.day.regl{background:color-mix(in srgb,var(--t-regl) 22%,var(--surface));color:var(--ink)}
.day.other.regl{background:color-mix(in srgb,var(--t-regl) 10%,var(--bg))}
.day.pred{outline:1.5px dashed color-mix(in srgb,var(--t-regl) 75%,var(--surface));outline-offset:-3px}
.day.today{color:var(--lilac-deep);box-shadow:0 0 0 1.5px var(--lilac) inset}
.day.sel{background:var(--lilac);color:var(--on-lilac)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:34px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--t)}
.day.sel .dots i{background:var(--on-lilac)}

/* calendar week */
.weekscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.week{display:grid;grid-template-columns:44px repeat(7,minmax(92px,1fr));min-width:690px}
.week .colhead{position:sticky;top:0;padding:8px 4px;text-align:center;font-size:12px;border-bottom:1px solid var(--line);background:var(--surface);z-index:2}
.week .colhead b{display:block;font-size:17px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.week .colhead.today b{color:var(--lilac-deep)}
.week .colhead .tk{display:block;width:100%;margin-top:3px;padding:2px 4px;border:0;border-radius:6px;font:inherit;font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--t) 16%,var(--surface));color:var(--t);cursor:pointer}
.week .colhead.regl{box-shadow:0 -3px 0 var(--t-regl) inset}
.week .colhead .hl{display:block;font-size:10.5px;color:var(--t-manita);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hours{position:relative}
.hours div{height:var(--hour);font-size:10.5px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-6px);font-variant-numeric:tabular-nums}
.wcol{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--line) calc(var(--hour) - 1px),var(--line) var(--hour))}
.wcol.today{background-color:color-mix(in srgb,var(--lilac) 6%,var(--surface))}

// ---------- dates ----------
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
const daysBetween = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const toMin = t => { const [h,m] = (t||"0:0").split(":").map(Number); return h*60+m; };
const fmtLong = s => parse(s).toLocaleDateString("tr-TR",{weekday:"long", day:"numeric", month:"long"});
const fmtShort = s => parse(s).toLocaleDateString("tr-TR",{day:"numeric", month:"short"});
const fmtDate = s => parse(s).toLocaleDateString("tr-TR",{day:"numeric", month:"long", year:"numeric"});
const nextOcc = s => { const t = today(); let c = t.slice(0,4) + s.slice(4); if (c < t) c = (+t.slice(0,4) + 1) + s.slice(4); return c; };
const ageOn = (birth, on) => { let a = +on.slice(0,4) - +birth.slice(0,4); if (on.slice(5) < birth.slice(5)) a--; return a; };
function span(from){ // "1 yıl 3 ay" between a date and today
  const a = parse(from), b = parse(today());
  let m = (b.getFullYear()-a.getFullYear())*12 + b.getMonth()-a.getMonth() - (b.getDate() < a.getDate() ? 1 : 0);
  if (m < 1) return "";
  const y = Math.floor(m/12); m %= 12;
  return [y ? `${y} yıl` : "", m ? `${m} ay` : ""].filter(Boolean).join(" ");
}

// ---------- state & storage ----------
const LS = "coco.v1", OLD_LS = "koko.v1";
let state = null, persisted = false;
function lsGet(){ try { const r = localStorage.getItem(LS) || localStorage.getItem(OLD_LS); return r ? JSON.parse(r) : null; } catch { return null; } }
let cloudLinked = false;
function lsSet(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch { if (!cloudLinked) toast("Tarayıcı kayda izin vermiyor. Gizli sekmede olabilirsin."); } }
function normalize(s){
  const b = Object.assign(blank(), s||{});
  b.manita = Object.assign(blankManita(), b.manita||{});
  for (const st of b.students) { st.notes = st.notes || []; st.plans = st.plans || []; }
  return b;
}

const cakeSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M4 15c2 1.5 4 1.5 6 0s4-1.5 6 0 3 1 4 0M12 11V7M12 4.5v.01"/></svg>`;
const dropSvg = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5S5.5 9.6 5.5 14.2a6.5 6.5 0 0 0 13 0C18.5 9.6 12 2.5 12 2.5z"/></svg>`;
function countChip(date){
  const n = daysBetween(today(), date);
  return n === 0 ? `<span class="due late">Bugün</span>` : n === 1 ? `<span class="due soon">Yarın</span>` : `<span class="due${n <= 7 ? " soon" : ""}">${n} gün</span>`;
}
function specialRow(x, date){
  const open = x.id ? `data-mday="${x.id}"` : x.stu ? `data-view-stu="${x.stu}"` : `data-goto="manitam"`;
  return `<div class="task"><span class="sp-ic" style="${tvar(x.k || "manita")}">${x.k === "stu" ? cakeSvg : heartSvg}</span>
    <div class="body"><div class="title">${esc(x.t)}</div><div class="small muted">${[date ? fmtLong(date) : "", x.sub].filter(Boolean).map(esc).join(" · ")}</div></div>
    ${date ? countChip(date) : ""}<button class="iconbtn" ${open} aria-label="Aç">${chevSvg}</button></div>`;
}

// ---------- UI state ----------
let stuMode = "ogrenci", tab = "bugun", calMode = "ay", selDay = today(), monthCursor = today().slice(0,7), weekStart = mondayOf(today());
let mvEq = "Tümü", mvQ = "";
const TABS = ["bugun","takvim","gorevler","ogrenciler","manitam"];
try { const t = localStorage.getItem("coco.tab") || localStorage.getItem("koko.tab"); if (TABS.includes(t)) tab = t; const cm = localStorage.getItem("coco.cal") || localStorage.getItem("koko.cal"); if (cm) calMode = cm; } catch {}
if (TABS.includes(location.hash.slice(1))) tab = location.hash.slice(1);

const view = document.getElementById("view");
const tvar = t => `--t:var(${TYPES[t]?.renk || EXTRA_COLORS[t] || "--lilac"})`;
const editSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>`;
const xSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
const chevSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>`;

function render(){
  document.getElementById("hdrDate").textContent = fmtLong(today());
  setPill(pillMode());
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  const bs = document.getElementById("bannerSlot");
  const fresh = !state.events.length && !state.tasks.length && !state.students.length;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  bs.innerHTML = !sync.key && standalone ? `<div class="banner"><span class="grow"><b>Ana ekrandaki COCO henüz ortak kayda bağlı değil.</b> iPhone ana ekran uygulamasına ayrı hafıza veriyor. Kurulum linkini kopyalayıp buraya yapıştır, kayıtların gelsin.</span>
      <form id="pairForm" class="inline" style="flex:1 1 100%"><input class="input" id="pair-text" placeholder="Kurulum linkini yapıştır" aria-label="Kurulum linki" autocomplete="off" autocapitalize="off" spellcheck="false" required><button class="btn">Bağla</button></form></div>`
    : pushOffer() ? `<div class="banner"><span class="grow"><b>Bildirimler açılsın mı?</b> Sabah özeti, ders ve sınav hatırlatmaları telefonuna gelsin. Neyin geleceğini zil simgesinden seçebilirsin.</span><button class="btn sm" data-act="push-on">Bildirimleri aç</button><button class="btn sm ghost" data-act="push-later">Şimdi değil</button></div>`
    : fresh && tab === "bugun" ? `<div class="banner"><span class="grow"><b>COCO'ya hoş geldin!</b> Sağ alttaki + ile ilk dersini, pilates seansını ya da ödevini ekle. Öğrencilerini “Öğrenciler” sekmesinden, döngünü aşağıdaki regl kartından girebilirsin. Kayıtların bu cihazda saklanır.</span></div>`
    : backupDue() ? `<div class="banner"><span class="grow"><b>Yedek alma zamanı.</b> Kayıtların sadece bu cihazda duruyor${lsRead(BK) ? `, son yedek ${fmtShort(lsRead(BK))}` : " ve henüz yedek almadın"}. Telefon değişir ya da tarayıcı temizlenirse kaybolmasın.</span><button class="btn sm" data-act="backup">Yedek al</button><button class="btn sm ghost" data-act="snooze">Sonra</button></div>` : "";
  ({bugun:renderToday, takvim:renderCal, gorevler:renderTasks, ogrenciler:renderStudents, manitam:renderManita})[tab]();
}

function evRow(e, d, opts = {}){
  const nowM = new Date().getHours()*60 + new Date().getMinutes();
  const isToday = d === today();
  const cls = isToday && toMin(e.start) <= nowM && nowM < toMin(e.end) ? " now" : (isToday && toMin(e.end) <= nowM && opts.dimPast ? " past" : "");
  let meta = [e.place, e.repeat === "weekly" ? "Her hafta" : ""].filter(Boolean).join(" · ");
  if (PILATES(e.type) && progOf(e.prog)) meta = [meta, progOf(e.prog).name].filter(Boolean).join(" · ");
  if (PILATES(e.type) && e.students.length) {
    const came = (e.att[d]||[]).length;
    meta = [meta, `${e.students.length} kişi${came ? ` · ${came} geldi` : ""}`].filter(Boolean).join(" · ");
  }
  return `<button class="ev${cls}" style="${tvar(e.type)}" data-open-ev="${e.id}" data-day="${d}">
    <div class="time">${esc(e.start)}<span>${esc(e.end)}</span></div>
    <div class="body"><div class="title">${esc(e.title)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ""}</div>
    <span class="tag">${TYPES[e.type]?.ad || ""}</span></button>`;
}
function dueChip(t){
  if (t.done) return `<span class="due">Bitti</span>`;
  const n = daysBetween(today(), t.due);
  if (n < 0) return `<span class="due late">${-n} gün geçti</span>`;
  if (n === 0) return `<span class="due late">Bugün</span>`;
  if (n === 1) return `<span class="due soon">Yarın</span>`;
  return `<span class="due${n <= 3 ? " soon" : ""}">${n} gün</span>`;
}
const checkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`;
function taskRow(t){
  return `<div class="task${t.done ? " done" : ""}">
    <button class="check${t.done ? " on" : ""}" data-toggle-task="${t.id}" aria-label="${t.done ? "Tamamlanmadı olarak işaretle" : "Tamamlandı olarak işaretle"}">${t.done ? checkSvg : ""}</button>
    <div class="body"><div class="title">${esc(t.title)}</div><div class="small muted">${esc(TASKKINDS[t.kind])}${t.course ? " · " + esc(t.course) : ""} · ${fmtShort(t.due)}${t.time ? " · " + esc(t.time) : ""}</div>${t.note ? `<div class="small muted">${esc(t.note)}</div>` : ""}</div>
    ${dueChip(t)}
    <button class="iconbtn" data-open-task="${t.id}" aria-label="Düzenle">${editSvg}</button>
  </div>`;
}

function cycleCard(){
  const st = cycleStats(), on = ongoing();
  let main, sub, btns;
  if (!st.last) {
    main = "Döngünü takvime ekle";
    sub = "Regl başladığında işaretle. COCO ortalamanı hesaplayıp bir sonrakini takvimde tahmin eder.";
    btns = `<button class="btn sm regl" data-regl-start="${today()}">Bugün başladı</button><button class="btn sm regl-ghost" data-cycles>Geçmiş tarih ekle</button>`;
  } else if (on) {
    main = `Regl ${daysBetween(on.start, today()) + 1}. gün`;
    sub = `${fmtShort(on.start)} tarihinde başladı · ortalama süre ${st.len} gün`;
    btns = `<button class="btn sm regl" data-regl-end="${today()}">Bugün bitti</button><button class="btn sm regl-ghost" data-cycles>Döngü</button>`;
  } else {
    const nx = nextPeriod(), n = daysBetween(today(), nx), day = daysBetween(st.last.start, today()) + 1;
    main = n > 1 ? `Sonraki regl ${n} gün sonra` : n === 1 ? "Sonraki regl yarın bekleniyor" : n === 0 ? "Regl bugün bekleniyor" : `Regl ${-n} gün gecikti`;
    sub = `Döngünün ${day}. günü · tahmini ${fmtShort(nx)} · döngü ${st.avg} gün${st.measured ? "" : " (varsayılan)"}`;
    btns = `<button class="btn sm regl" data-regl-start="${today()}">Bugün başladı</button><button class="btn sm regl-ghost" data-cycles>Döngü</button>`;
  }
  return `<div class="cyc"><span class="drop">${dropSvg}</span><div class="body"><div class="label">Regl takvimi</div><div class="title">${main}</div><div class="small muted">${sub}</div></div><div class="actions">${btns}</div></div>`;
}

function renderToday(){
  const d = today();
  const evs = eventsOn(d);
  const ws = mondayOf(d);
  let derse = 0, pil = 0, dan = 0;
  for (let i = 0; i < 7; i++) for (const e of eventsOn(addDays(ws,i))) {
    if (e.type === "ders") derse++; else if (PILATES(e.type)) pil++; else if (e.type === "danisan") dan++;
  }
  const upcoming = state.tasks.filter(t => !t.done && daysBetween(d, t.due) <= 10).sort((a,b) => dueKey(a) < dueKey(b) ? -1 : 1);
  const lowPkg = state.students.filter(s => leftOf(s) <= 1);
  const inSess = new Set();
  for (let i = 0; i < 7; i++) for (const e of eventsOn(addDays(ws,i))) if (PILATES(e.type)) e.students.forEach(x => inSess.add(x));
  const noPlan = state.students.filter(s => inSess.has(s.id) && !planOf(s, ws));
  const w = state.water[d] || 0;
  const tomorrow = eventsOn(addDays(d,1));
  const h = new Date().getHours();
  const hi = h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar";
  const specials = [];
  for (let i = 0; i <= 14; i++) { const dd = addDays(d, i); for (const x of specialsOn(dd)) if (x.k === "manita" || i <= 7) specials.push([x, dd]); }

  view.innerHTML = `
    <div class="section" style="margin-top:8px"><h1>${hi}</h1>
      <div class="muted">${evs.length ? `Bugün ${evs.length} planın var${upcoming.length ? `, ${upcoming.length} yaklaşan teslim/sınav` : ""}.` : "Bugün takvimin boş."}</div></div>
    <div class="section"><div class="stats">
      <div class="stat"><div class="n">${derse}</div><div class="k">Okul dersi bu hafta</div></div>
      <div class="stat"><div class="n">${pil}</div><div class="k">Pilates seansı bu hafta</div></div>
      <div class="stat"><div class="n">${dan}</div><div class="k">Danışan / staj</div></div>
    </div></div>
    <div class="section"><div class="section-head"><h2>Bugünün akışı</h2><span class="small muted">${fmtShort(d)}</span></div>
      <div class="list">${evs.length ? evs.map(e => evRow(e,d,{dimPast:true})).join("") : `<div class="empty">Bugün için kayıt yok. Sağ alttaki + ile ders, seans ya da görüşme ekle.</div>`}</div></div>
    ${lowPkg.length ? `<div class="section"><div class="section-head"><h2>Paketi bitmek üzere</h2></div><div class="list">${lowPkg.map(s => `<div class="task"><div class="body"><div class="title">${esc(s.name)}</div><div class="small muted">${leftOf(s) <= 0 ? "Paket bitti, yenileme konuşulmalı" : "Son 1 dersi kaldı"}</div></div><button class="btn sm ghost" data-renew="${s.id}">Paketi yenile</button></div>`).join("")}</div></div>` : ""}
    ${noPlan.length ? `<div class="section"><div class="section-head"><h2>Bu haftanın programı hazır değil</h2></div>
      <div class="small muted">Bu hafta seansı olan ${noPlan.length} öğrencinin programı yok. İsme dokun, geçen haftayı kopyalayıp düzenle.</div>
      <div class="chips">${noPlan.map(s => `<button class="chip" data-view-stu="${s.id}"><i></i>${esc(s.name)}</button>`).join("")}</div></div>` : ""}
    <div class="section"><div class="section-head"><h2>Yaklaşan teslim ve sınavlar</h2><button class="btn sm ghost" data-goto="gorevler">Tümü</button></div>
      <div class="list">${upcoming.length ? upcoming.slice(0,4).map(taskRow).join("") : `<div class="empty">Önümüzdeki 10 günde teslim ya da sınav yok.</div>`}</div></div>

    <div class="divider"><span class="label">Kişisel</span></div>
    ${meWho() && h >= 19 && !evalOf(d, meWho()) ? `<div class="section" style="margin-top:12px"><div class="evcard"><div class="label">Gün sonu</div><div>${PEOPLE[otherOf(meWho())].ad} bugün nasıldı? Değerlendirmeni doldur.</div><div class="actions" style="justify-content:flex-start"><button class="btn sm warm" data-eval="${meWho()}" data-day="${d}">${PEOPLE[otherOf(meWho())].acc} değerlendir</button></div></div></div>` : ""}
    <div class="section" style="margin-top:12px">${cycleCard()}</div>
    ${specials.length ? `<div class="section"><div class="section-head"><h2>Yaklaşan özel günler</h2></div><div class="list">${specials.slice(0,4).map(([x,dd]) => specialRow(x, dd)).join("")}</div></div>` : ""}
    <div class="section"><div class="section-head"><h2>Su takibi</h2><span class="small muted">Hedef ${(WATER_GOAL*GLASS_ML/1000).toLocaleString("tr-TR")} L</span></div>
      <div class="water">${Array.from({length:WATER_GOAL}, (_,i) => `<button class="glass${i < w ? " on" : ""}" data-water="${i+1}" aria-label="${i+1}. bardak"></button>`).join("")}<span class="amt">${(w*GLASS_ML).toLocaleString("tr-TR")} ml</span></div></div>
    <div class="divider"><span class="label">Yarın</span></div>
    <div class="section" style="margin-top:12px"><div class="section-head"><h2>Yarının akışı</h2><button class="btn sm ghost" data-new-ev="${addDays(d,1)}">Yarına ekle</button></div>
      <div class="small muted" style="text-transform:capitalize">${fmtLong(addDays(d,1))}</div>
      <div class="list">${tomorrow.map(e => evRow(e, addDays(d,1))).join("")}${tasksOn(addDays(d,1)).filter(t => !t.done).map(taskRow).join("")}${!tomorrow.length && !tasksOn(addDays(d,1)).some(t => !t.done) ? `<div class="empty">Yarın için kayıt yok.</div>` : ""}</div></div>
  `;
}

function legend(){
  return `<div class="legend">${Object.entries(TYPES).map(([k,v]) => `<span style="${tvar(k)}"><i></i>${v.ad}</span>`).join("")}
    <span style="${tvar("manita")}"><i></i>Özel gün</span><span style="${tvar("regl")}"><i></i>Regl</span><span><i class="dash"></i>Tahmini regl</span></div>`;
}
function reglDayBox(d){
  const p = periodOn(d), st = cycleStats();
  const txt = p ? (p.kind === "actual" ? `Regl ${p.day}. gün` : "Tahmini regl günü") : st.last ? `Döngünün ${Math.max(1, daysBetween(st.last.start, d) + 1)}. günü` : "Regl kaydı yok";
  const btn = p && p.kind === "actual" ? `<button class="btn sm regl" data-regl-end="${d}">Bu gün bitti</button>` : (d <= addDays(today(), 3) ? `<button class="btn sm regl" data-regl-start="${d}">Bu gün başladı</button>` : "");
  return `<div class="cyc" style="padding:10px 12px"><span class="drop">${dropSvg}</span><div class="body"><div class="title" style="font-size:15px">${txt}</div></div><div class="actions">${btn}<button class="btn sm regl-ghost" data-cycles>Döngü</button></div></div>`;
}
function renderCal(){
  const seg = `<div class="seg" role="group" aria-label="Görünüm"><button data-calmode="ay" aria-pressed="${calMode==="ay"}">Ay</button><button data-calmode="hafta" aria-pressed="${calMode==="hafta"}">Hafta</button></div>`;
  if (calMode === "ay") {
    const [y,m] = monthCursor.split("-").map(Number);
    const first = new Date(y, m-1, 1);
    const gridStart = mondayOf(ymd(first));
    const title = first.toLocaleDateString("tr-TR",{month:"long", year:"numeric"});
    let cells = WD.map(w => `<div class="wd">${w}</div>`).join("");
    const lastDay = ymd(new Date(y, m, 0));
    const weeks = Math.ceil((daysBetween(gridStart, lastDay) + 1) / 7);
    for (let i = 0; i < weeks*7; i++) {
      const d = addDays(gridStart, i);
      const p = periodOn(d);
      const types = [...new Set([...specialsOn(d).map(x => x.k), ...eventsOn(d).map(e => e.type), ...tasksOn(d).filter(t=>!t.done).map(t => t.kind === "sinav" ? "sinav" : "kisisel")])].slice(0,4);
      const cls = ["day", d.slice(0,7) !== monthCursor ? "other" : "", p ? (p.kind === "actual" ? "regl" : "pred") : "", d === today() ? "today" : "", d === selDay ? "sel" : ""].join(" ");
      cells += `<button class="${cls}" data-sel="${d}" aria-label="${fmtLong(d)}${p ? (p.kind === "actual" ? ", regl günü" : ", tahmini regl") : ""}">${parse(d).getDate()}<span class="dots">${types.map(t => `<i style="${tvar(t)}"></i>`).join("")}</span></button>`;
    }
    const evs = eventsOn(selDay), tks = tasksOn(selDay), sps = specialsOn(selDay);
    view.innerHTML = `
      <div class="section" style="margin-top:8px"><div class="calbar"><h2>${title}</h2>
        <button class="iconbtn" data-month="-1" aria-label="Önceki ay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
        <button class="btn sm line" data-month="0">Bugün</button>
        <button class="iconbtn" data-month="1" aria-label="Sonraki ay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button>
        ${seg}</div>
      <div class="month">${cells}</div>${legend()}</div>
      <div class="section"><div class="section-head"><h2 style="text-transform:capitalize">${fmtLong(selDay)}</h2><button class="btn sm ghost" data-new-ev="${selDay}">Bu güne ekle</button></div>
        <div class="list">${sps.map(x => specialRow(x)).join("")}${evs.map(e => evRow(e, selDay)).join("")}${tks.map(taskRow).join("")}${!evs.length && !tks.length && !sps.length ? `<div class="empty">Bu gün boş.</div>` : ""}
        ${reglDayBox(selDay)}</div></div>`;
  } else {
    const startH = 7, endH = 23;
    const days = Array.from({length:7}, (_,i) => addDays(weekStart, i));
    const title = `${fmtShort(days[0])} – ${fmtShort(days[6])}`;
    let html = `<div></div>` + days.map((d,i) => {
      const p = periodOn(d), sp = specialsOn(d), untimed = tasksOn(d).filter(t => !t.done && !t.time);
      return `<div class="colhead${d===today()?" today":""}${p && p.kind === "actual" ? " regl" : ""}">${WD[i]}<b>${parse(d).getDate()}</b>${sp.length ? `<span class="hl" title="${esc(sp.map(x => x.t).join(", "))}">♥ ${esc(sp[0].t)}</span>` : ""}${untimed.map(t => `<button class="tk" style="${tvar(t.kind === "sinav" ? "sinav" : "kisisel")}" data-open-task="${t.id}">${esc(t.title)}</button>`).join("")}</div>`;
    }).join("");
    html += `<div class="hours">${Array.from({length:endH-startH}, (_,i) => `<div>${pad(startH+i)}:00</div>`).join("")}</div>`;
    for (const d of days) {
      const blocks = eventsOn(d).map(e => {
        const top = Math.max(0, (toMin(e.start) - startH*60) / 60);
        const hgt = Math.max(0.5, (toMin(e.end) - toMin(e.start)) / 60);
        return `<button class="blk" style="${tvar(e.type)};top:calc(${top} * var(--hour));height:calc(${hgt} * var(--hour) - 2px)" data-open-ev="${e.id}" data-day="${d}"><b>${esc(e.title)}</b><span>${esc(e.start)}–${esc(e.end)}</span></button>`;
      }).join("") + tasksOn(d).filter(t => !t.done && t.time).map(t => {
        const top = Math.max(0, (toMin(t.time) - startH*60) / 60);
        return `<button class="blk" style="${tvar(t.kind === "sinav" ? "sinav" : "kisisel")};top:calc(${top} * var(--hour));height:calc(1 * var(--hour) - 2px)" data-open-task="${t.id}"><b>${esc(t.title)}</b><span>${esc(t.time)}${t.note ? " · " + esc(t.note) : ""}</span></button>`;
      }).join("");
      html += `<div class="wcol${d===today()?" today":""}" style="height:calc(${endH-startH} * var(--hour))">${blocks}</div>`;
    }
    view.innerHTML = `
      <div class="section" style="margin-top:8px"><div class="calbar"><h2>${title}</h2>
        <button class="iconbtn" data-week="-1" aria-label="Önceki hafta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
        <button class="btn sm line" data-week="0">Bu hafta</button>
        <button class="iconbtn" data-week="1" aria-label="Sonraki hafta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button>
        ${seg}</div>
      <div class="weekscroll"><div class="week">${html}</div></div>${legend()}</div>`;
  }
}

function renderTasks(){
  const open = state.tasks.filter(t => !t.done).sort((a,b) => dueKey(a) < dueKey(b) ? -1 : 1);
  const exams = open.filter(t => t.kind === "sinav"), work = open.filter(t => t.kind !== "sinav");
  const done = state.tasks.filter(t => t.done).sort((a,b) => dueKey(a) < dueKey(b) ? 1 : -1);

// ---------- notifications ----------
// The phone subscribes once; the hourly sender (bildirim/gonder.mjs) does the timing. iPhone
// allows this only for the home-screen app (iOS 16.4+), and asks for permission once, after a tap.
const VAPID_PUBLIC = "BNgRBStfvARVyGVIOHwK77cvWMwaqvRX7aqk1iWr9FMfarQtYWkkcmkLszyW0ov2GO7vQryKfzFLpGuuc7lN7B0";
const PUSH_ASKED = "coco.pushAsked", PUSH_PREFS = "coco.pushPrefs", PUSH_SAVED = "coco.pushSaved";
const PUSH_KINDS = [
  ["sabah", "Sabah özeti", "Her sabah 06:00'da günün planı"],
  ["seans", "Ders ve seans", "Başlamadan 1 saat önce"],
  ["uye", "Üyelerine hatırlat", "Ders günü 10:00'da; öğleden önceki dersler için bir gün önce 18:00'de"],
  ["sinav", "Sınav ve ödev", "Bir gün önce 20:00'de; saati girilmiş sınavlarda ayrıca 2 saat önce"],
  ["deger", "Gün sonu değerlendirmesi", "21:00'de, henüz doldurmadıysan"],
  ["paket", "Paket bitiyor", "Bir öğrencinin 1 dersi kalınca ve paketi bitince"],
  ["regl", "Regl yaklaşıyor", "Tahmini başlangıçtan 2 gün önce"],
];
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const pushPerm = () => pushSupported() ? Notification.permission : "unsupported";
const pushPrefs = () => { let p = {}; try { p = JSON.parse(lsRead(PUSH_PREFS) || "{}"); } catch {} return Object.fromEntries(PUSH_KINDS.map(([k]) => [k, p[k] !== false])); };
const pushOffer = () => !!sync.key && pushPerm() === "default" && !lsRead(PUSH_ASKED);
let swReg = null;
const swReady = () => swReg || (swReg = navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).catch(e => { swReg = null; throw e; }));
const b64url = s => { const b = atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); };
// make sure this phone's subscription, name and choices are on the server; writes only when something changed
async function pushSync(){
  if (pushPerm() !== "granted" || !sync.key) return false;
  try {
    const reg = await swReady();
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64url(VAPID_PUBLIC)});
    const row = {sub: sub.toJSON(), who: meWho(), prefs: pushPrefs()};
    const sig = J([row.sub.endpoint, row.who, row.prefs]);
    if (sig === lsRead(PUSH_SAVED)) return true;
    if (!await sync.push("POST", row)) return false;
    lsWrite(PUSH_SAVED, sig);
    return true;
  } catch { return false; }
}
async function pushEnable(){
  if (!pushSupported()) { toast("Bu tarayıcı bildirim desteklemiyor"); return; }
  let perm = Notification.permission;
  if (perm === "default") { try { perm = await Notification.requestPermission(); } catch { perm = Notification.permission; } }
  if (perm !== "granted") { toast("Bildirim izni verilmedi"); return; }
  toast(await pushSync() ? "Bildirimler açıldı" : "Bildirimler açıldı ama sunucuya kaydedilemedi, internet gelince tekrar dener");
}
function pushSheet(){
  const perm = pushPerm(), prefs = pushPrefs();
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const status = perm === "unsupported"
      ? (/iPhone|iPad/.test(navigator.userAgent) && !standalone
        ? "iPhone'da bildirimler yalnızca ana ekrana eklenmiş COCO'da çalışır. Safari'de Paylaş > Ana Ekrana Ekle ile ekle, oradan açıp tekrar dene."
        : "Bu tarayıcı bildirim desteklemiyor. iPhone'da iOS 16.4 veya üstü gerekir.")
    : perm === "denied" ? "Bildirim izni kapalı. Ayarlar > Bildirimler > COCO'dan açabilirsin."
    : !sync.key ? "Bildirimler için bu cihazın ortak kayda bağlı olması gerekiyor."
    : perm === "granted" ? "Bildirimler bu telefonda açık." : "Bildirimler henüz kapalı.";
  openSheet(`
    <div class="head"><h2>Bildirimler</h2>${closeBtn}</div>
    <div class="field" style="gap:14px">
      <div class="small">${esc(status)}</div>
      ${perm === "default" && sync.key ? `<div class="actions" style="justify-content:flex-start"><button type="button" class="btn" id="p-on">Bildirimleri aç</button></div>` : ""}
      ${perm === "granted" ? `<div class="actions" style="justify-content:flex-start"><button type="button" class="btn sm line" id="p-test">Deneme bildirimi gönder</button></div>` : ""}
      <div class="field" style="gap:12px"><span>Neler gelsin?</span>
        ${PUSH_KINDS.map(([k, n, d]) => `<label class="toggle" style="align-items:flex-start"><input type="checkbox" data-pk="${k}" ${prefs[k] ? "checked" : ""}><span>${esc(n)}<br><small class="muted" style="font-weight:400">${esc(d)}</small></span></label>`).join("")}
      </div>
      ${!meWho() ? `<div class="small muted">Gün sonu değerlendirmesi hatırlatması için Manitam sayfasında bu telefonu kimin kullandığını seç.</div>` : ""}
      <div class="small muted">Seçimler bu telefona özel; Ramazan ve Ekin ayrı ayrı seçer. Bildirimler birkaç dakika gecikebilir.</div>
    </div>`, sh => {
      const on = sh.querySelector("#p-on");
      on && on.addEventListener("click", async () => { lsWrite(PUSH_ASKED, "1"); await pushEnable(); closeSheet(); render(); pushSheet(); });
      const test = sh.querySelector("#p-test");
      test && test.addEventListener("click", async () => {
        try { const reg = await swReady(); await reg.showNotification("COCO", {body:"Bildirimler bu telefonda çalışıyor.", icon:"icons/icon-192.png"}); }
        catch { toast("Deneme bildirimi gösterilemedi"); }
      });
      sh.addEventListener("change", ev => {
        const k = ev.target.dataset && ev.target.dataset.pk; if (!k) return;
        const p = pushPrefs(); p[k] = ev.target.checked; lsWrite(PUSH_PREFS, J(p)); pushSync();
      });

// ---------- daily evaluation (Manitam) ----------
// Ramazan and Ekin each rate the other at the end of the day. One record per person per day,
// id "<date>_<who>", so edits from both phones merge cleanly. The other person's answers for a day
// open only after you have filled in your own, so nobody adjusts their scores to the other's.
const EVAL_Q = [
  ["İlgi", "Bugün bana ne kadar ilgi gösterdi?"],
  ["Zaman", "Bana ne kadar zaman ayırdı?"],
  ["İletişim", "Mesajlarıma ve aramalarıma ne kadar dönüş yaptı?"],
  ["Dinleme", "Anlattıklarımı ne kadar dinledi ve anladı?"],
  ["Sevgi gösterme", "Sevgisini sözle ya da davranışla ne kadar belli etti?"],
  ["Anlayış", "Halimi, yorgunluğumu ya da moralimi ne kadar anladı?"],
  ["Sabır ve ses tonu", "Bana karşı ne kadar sakin ve kibardı?"],
  ["Destek", "İşimde, dersimde ya da bir derdimde ne kadar yanımdaydı?"],
  ["Güven", "Bugün kendimi onun yanında ne kadar güvende hissettim?"],
  ["Mutluluk", "Bugün beni ne kadar mutlu etti?"],
];
const PEOPLE = {
  ramazan: {ad:"Ramazan", acc:"Ramazan'ı", dat:"Ramazan'a", gen:"Ramazan'ın"},
  ekin:    {ad:"Ekin",    acc:"Ekin'i",    dat:"Ekin'e",    gen:"Ekin'in"},
};
const otherOf = who => who === "ramazan" ? "ekin" : "ramazan";
const ME_KEY = "coco.me";
let meMemo = null, evalDay = today();
const meWho = () => { if (meMemo === null) meMemo = lsRead(ME_KEY); return PEOPLE[meMemo] ? meMemo : ""; };
const setMe = v => { meMemo = v; lsWrite(ME_KEY, v); pushSync(); };
const evalOf = (date, who) => state.manita.evals.find(e => e.date === date && e.who === who);
const evalAvg = e => e.scores.reduce((a,b) => a + b, 0) / e.scores.length;
const fmtScore = n => n.toLocaleString("tr-TR", {minimumFractionDigits:1, maximumFractionDigits:1});
const scoreTone = n => n >= 8 ? "hi" : n >= 5 ? "mid" : "lo";

function evalSection(){
  const me = meWho();
  if (!me) return `<div class="section"><div class="section-head"><h2>Gün sonu değerlendirmesi</h2></div>
    <div class="evcard"><div>Bu telefonu kim kullanıyor? Seçimini bu cihaz hatırlar.</div>
      <div class="actions" style="justify-content:flex-start"><button class="btn sm warm" data-me="ramazan">Ben Ramazan</button><button class="btn sm warm" data-me="ekin">Ben Ekin</button></div></div></div>`;
  const you = otherOf(me), mine = evalOf(evalDay, me), theirs = evalOf(evalDay, you), isToday = evalDay === today();
  const card = who => {
    const e = evalOf(evalDay, who), title = `${PEOPLE[who].ad} → ${PEOPLE[otherOf(who)].ad}`;
    let body;
    if (who === me) body = e ? `<div class="evscore ${scoreTone(evalAvg(e))}">${fmtScore(evalAvg(e))}<small>/10</small></div><button class="btn sm ghost" data-eval="${me}" data-day="${evalDay}">Düzenle</button>`
                             : `<div class="small muted">Henüz doldurmadın.</div><button class="btn sm warm" data-eval="${me}" data-day="${evalDay}">${PEOPLE[you].acc} değerlendir</button>`;
    else body = !e ? `<div class="small muted">${PEOPLE[who].ad} henüz doldurmadı.</div>`
              : !mine ? `<div class="small muted">${PEOPLE[who].ad} doldurdu. Sen de doldurunca puanları açılır.</div>`
              : `<div class="evscore ${scoreTone(evalAvg(e))}">${fmtScore(evalAvg(e))}<small>/10</small></div>`;
    return `<div class="evcard"><div class="label">${title}</div>${body}</div>`;
  };
  // per-question table: my answers always, theirs only once mine exist
  const cols = [mine && [me, mine], mine && theirs && [you, theirs]].filter(Boolean);
  const table = cols.length ? `<div class="evtable" style="--cols:${cols.length}">
      <div class="evrow head"><span>Soru</span>${cols.map(([w]) => `<span>${PEOPLE[w].ad} → ${PEOPLE[otherOf(w)].ad}</span>`).join("")}</div>
      ${EVAL_Q.map(([t], i) => `<div class="evrow"><span>${t}</span>${cols.map(([, e]) => `<b class="${scoreTone(e.scores[i])}">${e.scores[i]}</b>`).join("")}</div>`).join("")}
    </div>
    ${cols.map(([w, e]) => e.liked || e.better ? `<div class="evnote"><div class="label">${PEOPLE[w].gen} yazdıkları</div>${e.liked ? `<div><b>En çok hoşuma giden:</b> ${esc(e.liked)}</div>` : ""}${e.better ? `<div><b>Yarın daha iyi olabilecek:</b> ${esc(e.better)}</div>` : ""}</div>` : "").join("")}` : "";
  // last 7 days, only days both filled in (keeps the reveal rule)
  const days = Array.from({length:7}, (_, i) => addDays(today(), -i)).filter(d => evalOf(d, me) && evalOf(d, you));
  const wk = who => fmtScore(days.reduce((a, d) => a + evalAvg(evalOf(d, who)), 0) / days.length);
  return `<div class="section"><div class="section-head"><h2>Gün sonu değerlendirmesi</h2><button class="btn sm line" data-me-reset title="Bu telefonu kimin kullandığını değiştir">Ben ${PEOPLE[me].ad}</button></div>
    <div class="weeknav"><button class="iconbtn" data-evday="${addDays(evalDay, -1)}" aria-label="Önceki gün"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
      <b style="text-transform:capitalize">${fmtLong(evalDay)}${isToday ? ` <span class="mini">Bugün</span>` : ""}</b>
      <button class="iconbtn" data-evday="${addDays(evalDay, 1)}" aria-label="Sonraki gün" ${isToday ? "disabled" : ""}>${chevSvg}</button></div>

}

function evalSheet(who, date){
  const ex = evalOf(date, who), to = otherOf(who);
  const scores = ex ? [...ex.scores] : Array(EVAL_Q.length).fill(0);
  openSheet(`
    <div class="head"><h2>${PEOPLE[who].ad} → ${PEOPLE[to].ad}</h2>${closeBtn}</div>
    <div class="small muted" style="text-transform:capitalize">${fmtLong(date)}</div>
    <div class="small">${PEOPLE[to].ad} bugün nasıldı? Her soruya 1 ile 10 arasında puan ver.</div>
    <form id="evlForm" class="field" style="gap:16px">
      ${EVAL_Q.map(([t, q], i) => `<div class="field qrow" data-q="${i}"><span><b>${i + 1}. ${t}</b> · ${q}</span>
        <div class="scale" role="group" aria-label="${t}">${Array.from({length:10}, (_, k) => `<button type="button" data-score="${k + 1}" aria-pressed="${scores[i] === k + 1}">${k + 1}</button>`).join("")}</div></div>`).join("")}
      <label class="field"><span>Bugün en çok hoşuma giden</span><textarea class="input" id="evl-liked" placeholder="İsteğe bağlı">${esc(ex?.liked || "")}</textarea></label>
      <label class="field"><span>Yarın daha iyi olabilecek şey</span><textarea class="input" id="evl-better" placeholder="İsteğe bağlı">${esc(ex?.better || "")}</textarea></label>
      <div class="small" id="evl-avg"></div>
      <div id="evl-confirm"></div>
      <div class="actions">${ex ? `<button type="button" class="btn danger sm" id="evl-del">Sil</button>` : ""}<span class="sp"></span><button type="button" class="btn line" data-close>Vazgeç</button><button class="btn warm" type="submit">Kaydet</button></div>
    </form>`, sh => {
      const avgEl = sh.querySelector("#evl-avg");
      const showAvg = () => { const done = scores.filter(Boolean); avgEl.textContent = done.length ? `${done.length}/10 soru puanlandı · ortalama ${fmtScore(done.reduce((a,b) => a + b, 0) / done.length)}` : ""; };
      showAvg();
      sh.querySelector("#evlForm").addEventListener("click", ev => {
        const b = ev.target.closest("[data-score]"); if (!b) return;
        const row = b.closest("[data-q]"), i = +row.dataset.q;
        scores[i] = +b.dataset.score;
        row.querySelectorAll("[data-score]").forEach(x => x.setAttribute("aria-pressed", x === b));
        showAvg();
      });
      sh.querySelector("#evlForm").addEventListener("submit", ev => {
        ev.preventDefault();
        const missing = scores.map((s, i) => s ? 0 : i + 1).filter(Boolean);
        if (missing.length) { toast(`Puan verilmeyen soru: ${missing.join(", ")}`); sh.querySelector(`[data-q="${missing[0] - 1}"]`).scrollIntoView({block:"center"}); return; }
        const data = {scores:[...scores], liked:sh.querySelector("#evl-liked").value.trim(), better:sh.querySelector("#evl-better").value.trim()};
        if (ex) Object.assign(ex, data); else state.manita.evals.push({id:`${date}_${who}`, date, who, ...data});
        evalDay = date; save(); closeSheet(); render();
        toast(evalOf(date, to) ? `Kaydedildi. ${PEOPLE[to].gen} puanları da açıldı.` : "Değerlendirme kaydedildi");
      });
      const del = sh.querySelector("#evl-del");
      del && del.addEventListener("click", () => confirmDel(sh.querySelector("#evl-confirm"), "Bu günün değerlendirmesi silinsin mi?", () => {
        state.manita.evals = state.manita.evals.filter(e => e !== ex); save(); closeSheet(); render(); toast("Silindi");
      }));
    }, true);
}

const slot = document.getElementById("sheetSlot");
let lastFocus = null;
function openSheet(html, onMount, noFocus){
  if (!slot.innerHTML) lastFocus = document.activeElement;
  slot.innerHTML = `<div class="overlay" data-close-overlay><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sh = slot.querySelector(".sheet");
  onMount && onMount(sh);
  if (!noFocus) { const f = sh.querySelector("input,select,textarea,button:not(.iconbtn)"); f && f.focus(); }
  return sh;
}
function closeSheet(){ const r = rec; rec = null; try { r && r.abort(); } catch {} slot.innerHTML = ""; lastFocus && lastFocus.focus && lastFocus.focus(); }
const closeBtn = `<button class="iconbtn" data-close aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
const confirmDel = (box, msg, yes) => {
  box.innerHTML = `<div class="confirm"><span style="flex:1 1 160px">${msg}</span><button type="button" class="btn sm danger" data-yes>Evet, sil</button></div>`;
  box.querySelector("[data-yes]").addEventListener("click", yes);
};

    });
}

function exEditorHtml(){

function mountExEditor(sh, list, eq){
  let ex = list, libEq = eq;
  const box = sh.querySelector("#x-ex"), libbox = sh.querySelector("#x-libbox"), libBtn = sh.querySelector("#x-lib"), q = sh.querySelector("#x-q");
  const draw = focusIdx => {
    box.innerHTML = ex.map((x,i) => `<div class="exrow" data-i="${i}">
      <span class="no">${i+1}</span>
      <input class="input" list="exLib" data-f="name" value="${esc(x.name)}" placeholder="Hareket" aria-label="${i+1}. hareket adı">

      <div class="tools"><button type="button" class="iconbtn" data-mv="-1" aria-label="Yukarı taşı" ${i===0?"disabled":""}>${upSvg}</button><button type="button" class="iconbtn" data-mv="1" aria-label="Aşağı taşı" ${i===ex.length-1?"disabled":""}>${downSvg}</button><button type="button" class="iconbtn" data-rm aria-label="Hareketi çıkar">${xSvg}</button></div>
      <div class="hint">${esc(descOf(x.name))}</div>
      <input class="input note-in" data-f="note" value="${esc(x.note)}" placeholder="Not: yay, modifikasyon…" aria-label="${i+1}. hareket notu">
    </div>`).join("") || `<div class="small muted">Henüz hareket yok. Aşağıdaki listeden dokunarak ekle ya da kendin yaz.</div>`;
    if (focusIdx !== undefined) { const r = box.querySelector(`[data-i="${focusIdx}"] [data-f="name"]`); r && r.focus(); }
  };
  const drawLib = () => {
    if (libbox.hidden) return;
    sh.querySelector("#x-leq").innerHTML = ["Tümü", ...EQUIP].map(e => `<button type="button" class="chip" style="${tvar("pilates")}" data-leq="${e}" aria-pressed="${libEq === e}">${e}</button>`).join("");
    const inProg = new Set(ex.map(x => low(x.name)));
    let found = filterMoves(libEq, q.value), other = false;
    if (!found.length && q.value.trim() && libEq !== "Tümü") { found = filterMoves("Tümü", q.value); other = found.length > 0; }
    sh.querySelector("#x-liblist").innerHTML = (other ? `<div class="small muted">${esc(libEq)} için sonuç yok, diğer aletlerde bulunanlar:</div>` : "") + (found.length ? found.map(m => moveItem(m, true).replace(`class="add"`, `class="add${inProg.has(low(m.name)) ? " on" : ""}"`)).join("") : `<div class="small muted">Eşleşen hareket yok. “Kendim yazayım” ile ekleyebilirsin.</div>`);
  };
  const toggleLib = open => { libbox.hidden = !open; libBtn.setAttribute("aria-expanded", open); libBtn.textContent = open ? "Listeyi kapat" : "Hareket listesinden seç"; drawLib(); };
  draw();
  box.addEventListener("input", ev => {
    const r = ev.target.closest("[data-i]"); if (!r || !ev.target.dataset.f) return;
    ex[+r.dataset.i][ev.target.dataset.f] = ev.target.value;
    if (ev.target.dataset.f === "name") r.querySelector(".hint").textContent = descOf(ev.target.value);
  });
  box.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    const i = +b.closest("[data-i]").dataset.i;
    if (b.hasAttribute("data-rm")) { ex.splice(i,1); draw(); drawLib(); }
    else if (b.dataset.mv) { const j = i + +b.dataset.mv; [ex[i], ex[j]] = [ex[j], ex[i]]; draw(); }
  });
  libBtn.addEventListener("click", () => { toggleLib(libbox.hidden); if (!libbox.hidden) q.focus(); });
  q.addEventListener("input", drawLib);
  libbox.addEventListener("click", ev => {
    const c = ev.target.closest("[data-leq]"); if (c) { libEq = c.dataset.leq; drawLib(); return; }
    const a = ev.target.closest("[data-addmove]"); if (!a) return;
    ex = ex.filter(x => x.name.trim()); ex.push({name:a.dataset.addmove, dose:"", note:""}); draw(); drawLib();
    toast(`${a.dataset.addmove} eklendi (${ex.length}. sıra)`);
  });
  sh.querySelector("#x-add").addEventListener("click", () => { ex.push({name:"", dose:"", note:""}); draw(ex.length-1); });
  if (!ex.length) toggleLib(true);
  return {
    setEq(e){ libEq = e; drawLib(); },
    list: () => ex.map(x => ({name:x.name.trim(), dose:(x.dose||"").trim(), note:(x.note||"").trim()})).filter(x => x.name),
  };
}

function studentView(id, week = mondayOf(today())){
  const s = state.students.find(x => x.id === id); if (!s) return;
  const used = usedOf(s), left = s.pkg - used;
  const visits = visitsOf(id);
  const info = [
    ["Telefon", s.phone ? `<a href="tel:${esc(s.phone.replace(/[^\d+]/g, ""))}">${esc(s.phone)}</a>` : ""],
    ["E-posta", s.email ? esc(s.email) : ""],
    ["Doğum tarihi", s.birth ? `${fmtDate(s.birth)} · ${ageOn(s.birth, today())} yaş` : ""],
    ["Kayıt tarihi", s.joined ? `${fmtDate(s.joined)}${span(s.joined) ? ` · ${span(s.joined)}` : ""}` : ""],
    ["Meslek", esc(s.job)], ["Acil durumda", esc(s.emergency)],
    ["Paket", `${used}/${s.pkg} ders · ${fmtShort(s.start)} başladı`],
  ].filter(x => x[1]);
  const plan = planOf(s, week), prev = prevPlan(s, week), isThis = week === mondayOf(today());
  const weeks = [...s.plans].sort((a,b) => a.week < b.week ? 1 : -1);
  const tpl = state.programs.length ? `<div class="actions" style="justify-content:flex-start"><select class="input" id="pl-tpl" aria-label="Şablon seç" style="width:auto;flex:1 1 160px">${state.programs.map(p => `<option value="${p.id}" ${p.id === s.prog ? "selected" : ""}>${esc(p.name)} · ${esc(p.equip)}</option>`).join("")}</select><button type="button" class="btn sm line" data-plan-tpl>Şablondan başlat</button></div>` : "";
  const planHtml = plan ? `
      ${plan.note ? `<div class="small"><b>Odak:</b> ${esc(plan.note)}</div>` : ""}
      <ol class="exlist">${exItems(plan.exercises)}</ol>

    : `<div class="small muted" style="margin-bottom:8px">${isThis ? "Bu hafta" : "Bu hafta için"} henüz program yok.</div>
      <div class="actions" style="justify-content:flex-start">${prev ? `<button type="button" class="btn sm" data-plan-prev>${fmtShort(prev.week)} haftasını kopyala, düzenle</button>` : ""}<button type="button" class="btn sm${prev ? " ghost" : ""}" data-plan-new>Yeni program yaz</button></div>
      ${tpl}`;
  openSheet(`
    <div class="head"><h2>${esc(s.name)}</h2><button class="iconbtn" data-open-stu="${s.id}" aria-label="Bilgileri düzenle">${editSvg}</button>${closeBtn}</div>
    <div class="actions" style="justify-content:flex-start"><span class="left${left <= 0 ? " out" : left <= 2 ? " warn" : ""}">${left <= 0 ? "Paket bitti" : left + " ders kaldı"}</span><button class="btn sm ghost" data-renew="${s.id}">Paketi yenile</button></div>
    ${s.health ? `<div class="alert"><b>Sağlık durumu / sakatlık</b>${esc(s.health)}</div>` : ""}
    <div class="field"><span>Haftalık program</span>
      <div class="weeknav"><button type="button" class="iconbtn" data-pw="${addDays(week,-7)}" aria-label="Önceki hafta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
        <b>${weekRange(week)}${isThis ? ` <span class="mini">Bu hafta</span>` : ""}</b>
        <button type="button" class="iconbtn" data-pw="${addDays(week,7)}" aria-label="Sonraki hafta">${chevSvg}</button></div>
      <div class="planbox">${planHtml}</div>
      ${weeks.length ? `<div class="chips" aria-label="Programı olan haftalar">${weeks.slice(0,12).map(p => `<button type="button" class="chip" data-pw="${p.week}" aria-pressed="${p.week === week}">${fmtShort(p.week)}</button>`).join("")}</div>` : ""}
    </div>
    ${s.goal ? `<div class="proginfo"><b>Hedefi:</b> ${esc(s.goal)}</div>` : ""}
    <div class="kv">${info.map(([k,v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    ${!s.birth && !s.health && !s.goal ? `<div class="small muted">Doğum tarihi, sağlık durumu, hedef gibi detayları kalem simgesinden ekleyebilirsin.</div>` : ""}
    ${s.note ? `<div class="small"><b>Kısa not:</b> ${esc(s.note)}</div>` : ""}
    <div class="field"><span>Notlar</span>
      <form id="snForm" class="noteform"><textarea class="input" id="sn-text" placeholder="Seans gözlemi, ağrı, ilerleme, konuştuklarınız…" aria-label="Yeni not" required></textarea>
        <div class="actions"><input class="input" type="date" id="sn-date" value="${today()}" aria-label="Not tarihi"><button class="btn sm">Not ekle</button></div></form>
      <div class="notes">${[...s.notes].sort(byDateDesc).map(n => noteRow(n, "data-snote-del")).join("") || `<div class="small muted">Henüz not yok.</div>`}</div></div>
    <div class="field"><span>Gelişleri (${visits.length})</span>
      ${visits.length ? `<div class="visits">${visits.slice(0,12).map(x => `<span title="${esc(x.t)}">${fmtShort(x.d)}</span>`).join("")}</div>` : `<div class="small muted">Henüz yoklama yok.</div>`}</div>
  `, sh => {
    const copyOf = p => ({exercises: JSON.parse(JSON.stringify(p.exercises)), equip: p.equip, note: p.note || ""});
    sh.querySelector("#snForm").addEventListener("submit", ev => {
      ev.preventDefault();
      const text = sh.querySelector("#sn-text").value.trim(); if (!text) return;
      s.notes.push({id:uid(), date: sh.querySelector("#sn-date").value || today(), text});
      save(); render(); studentView(id, week); toast("Not eklendi");
    });
    sh.addEventListener("click", ev => {
      const b = ev.target.closest("button"); if (!b) return;
      const d = b.dataset;
      if (d.snoteDel) { s.notes = s.notes.filter(n => n.id !== d.snoteDel); save(); render(); studentView(id, week); toast("Not silindi"); }
      else if (d.pw) studentView(id, d.pw);
      else if ("planNew" in d || "planEdit" in d) planSheet(id, week);
      else if ("planPrev" in d) planSheet(id, week, copyOf(prev));
      else if ("planTpl" in d) { const p = progOf(sh.querySelector("#pl-tpl").value); p && planSheet(id, week, {exercises: JSON.parse(JSON.stringify(p.exercises)), equip: p.equip, note: p.goal || ""}); }
      else if ("planText" in d) copyText(planText(s, plan), "Program kopyalandı, öğrenciye gönderebilirsin");
      else if ("planNext" in d) { const nw = addDays(week, 7); if (planOf(s, nw)) { studentView(id, nw); toast("Sonraki haftanın programı zaten var"); } else planSheet(id, nw, copyOf(plan)); }
      else if ("planTplSave" in d) {
        state.programs.push({id:uid(), name:`${s.name.split(" ")[0]} · ${fmtShort(week)}`, level:LEVELS[0], equip: plan.equip || "Mat", goal: plan.note || "", exercises: JSON.parse(JSON.stringify(plan.exercises))});
        save(); toast("Şablonlara eklendi, adını Şablonlar'dan değiştirebilirsin");
      }
    });
  }, true);
}

// ---------- voice commands ----------
// JS \b only knows ASCII letters, so "çarşamba" or "özel" would never match; these treat
// Turkish letters as letters.
const UB = "(?:(?<=[\\p{L}\\p{N}])(?![\\p{L}\\p{N}])|(?<![\\p{L}\\p{N}])(?=[\\p{L}\\p{N}]))";
const URe = (src, flags = "") => new RegExp(src.replace(/\\b/g, UB), flags.includes("u") ? flags : flags + "u");
const U = re => URe(re.source, re.flags);
// Speech becomes text through the browser's own recognizer (Safari/Chrome, Turkish); the text is read
// with plain Turkish rules below. Anything that changes records is shown for confirmation first.
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const VOICE_REPLY = "coco.voiceReply";
const voiceReplyOn = () => lsRead(VOICE_REPLY) !== "0";
function speak(text){
  if (!voiceReplyOn() || !window.speechSynthesis || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "tr-TR";
    const v = speechSynthesis.getVoices().find(x => /^tr/i.test(x.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch {}
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const capTr = s => s ? s.charAt(0).toLocaleUpperCase("tr") + s.slice(1) : s;
const sayTime = hm => { const [h, m] = hm.split(":").map(Number); return m ? `${h} ${pad(m)}` : `${h}`; };

// "on sekizde" -> "18de", "altı buçukta" -> "6 buçukta"; speech engines usually give digits already
const UNITS = {bir:1, iki:2, "üç":3, "dört":4, "beş":5, "altı":6, yedi:7, sekiz:8, dokuz:9};
const TENS = {on:10, yirmi:20, otuz:30, "kırk":40, elli:50};
const NUM_SUFFIX = /^(|'?(da|de|ta|te|dan|den|tan|ten|ya|ye|a|e|ı|i|u|ü|yı|yi|nda|nde|ında|inde))$/;
function numToken(tok){
  for (const [w, n] of Object.entries(TENS)) if (tok.startsWith(w) && /^(|'?(da|de|dan|den))$/.test(tok.slice(w.length))) return [n, tok.slice(w.length).replace("'", ""), true];
  for (const [w, n] of Object.entries(UNITS)) if (tok.startsWith(w) && NUM_SUFFIX.test(tok.slice(w.length))) return [n, tok.slice(w.length).replace("'", ""), false];
  return null;
}
function normalizeCmd(raw){
  let t = low(raw).replace(/[’`´]/g, "'").replace(U(/(\d)\.(\d{2})\b/g), "$1:$2").replace(/[!?,;"“”()]/g, " ").replace(/\s+/g, " ").trim();
  const toks = t.split(" "), out = [];
  for (let i = 0; i < toks.length; i++) {
    const a = numToken(toks[i]);
    if (!a) { out.push(toks[i]); continue; }
    const b = a[2] && !a[1] && i + 1 < toks.length ? numToken(toks[i + 1]) : null;
    if (b && !b[2]) { out.push(String(a[0] + b[0]) + b[1]); i++; }
    else out.push(String(a[0]) + a[1]);
  }
  return out.join(" ");
}

const WEEKDAYS = [["pazartesi",1],["salı",2],["çarşamba",3],["perşembe",4],["cumartesi",6],["cuma",5],["pazar",0]];
const MONTHS = ["ocak","şubat","mart","nisan","mayıs","haziran","temmuz","ağustos","eylül","ekim","kasım","aralık"];
function parseDate(t){
  const T = today();
  if (U(/\b(öbür gün|yarından sonra)/).test(t)) return addDays(T, 2);
  if (U(/\byarın/).test(t)) return addDays(T, 1);
  if (U(/\bbugün/).test(t)) return T;
  let m = t.match(URe(`\\b(\\d{1,2}) (${MONTHS.join("|")})`));
  if (m) {
    let y = +T.slice(0, 4), d = `${y}-${pad(MONTHS.indexOf(m[2]) + 1)}-${pad(+m[1])}`;
    if (d < T) d = `${y + 1}${d.slice(4)}`;
    return d;
  }
  if ((m = t.match(U(/\bayın (\d{1,2})/)))) {
    let d = `${T.slice(0, 7)}-${pad(+m[1])}`;
    if (d < T) { const n = parse(T); n.setMonth(n.getMonth() + 1); d = `${ymd(n).slice(0, 7)}-${pad(+m[1])}`; }
    return d;
  }
  for (const [w, wd] of WEEKDAYS) if (URe(`\\b${w}`).test(t)) {
    if (U(/\bhaftaya\b/).test(t)) return addDays(mondayOf(T), 7 + (wd + 6) % 7);
    return addDays(T, (wd - parse(T).getDay() + 7) % 7);
  }
  return null;
}
function parseTime(t){
  let h = null, min = 0, m;
  if ((m = t.match(U(/\b(\d{1,2}):(\d{2})/)))) { h = +m[1]; min = +m[2]; }
  else if ((m = t.match(U(/\b(\d{1,2}) (\d{2})'?(da|de|ta|te)\b/))) && +m[2] < 60) { h = +m[1]; min = +m[2]; }
  else if ((m = t.match(U(/\bsaat (\d{1,2})\b/))) || (m = t.match(U(/\bsaat (\d{1,2})'?\S*/))) || (m = t.match(U(/\b(\d{1,2})'?(da|de|ta|te)\b/))) || (m = t.match(U(/\b(\d{1,2}) buçuk/)))) {
    h = +m[1]; if (URe(`\\b${m[1]} buçuk`).test(t)) min = 30;
  }
  if (h === null || h > 23 || min > 59) return null;
  if (U(/\b(akşam|gece|öğleden sonra)/).test(t) && h < 12) h += 12;
  else if (U(/\böğle/).test(t) && h < 6) h += 12;
  else if (!U(/\bsabah/).test(t) && h >= 1 && h <= 7) h += 12;   // "6'da seans" almost always means 18:00
  let dur = null;
  if ((m = t.match(U(/\b(\d+) saat(lik)?\b/))) && !URe(`saat ${m[1]}\\b`).test(t)) dur = +m[1] * 60;
  if (U(/\bbir buçuk saat/).test(t) || U(/\b1 buçuk saat/).test(t)) dur = 90;
  if (U(/\byarım saat/).test(t)) dur = 30;
  if ((m = t.match(U(/\b(\d+) dakika/)))) dur = +m[1];
  let end = null;
  if ((m = t.match(U(/\b(\d{1,2})(?::(\d{2}))?'?(?:dan|den|tan|ten) (\d{1,2})(?::(\d{2}))?'?(?:a|e|ya|ye)? ?kadar/)))) {
    let eh = +m[3]; if (eh < h % 12 + 12 && eh <= 12 && h >= 12) eh += 12;
    end = `${pad(eh)}:${pad(+(m[4] || 0))}`;
  }
  return {start: `${pad(h)}:${pad(min)}`, dur, end};
}
const plusMin = (hm, n) => { const v = Math.min(23 * 60 + 59, toMin(hm) + n); return `${pad(Math.floor(v / 60))}:${pad(v % 60)}`; };
const studentsIn = t => state.students.filter(s => {
  const full = low(s.name), first = full.split(/\s+/)[0];
  return URe(`(^|\\s)${escRe(full)}`).test(t) || (first.length > 1 && URe(`(^|\\s)${escRe(first)}`).test(t));
});
function manitaNamed(t){
  const m = state.manita, me = meWho();
  const names = [m.nick, (m.name || "").split(" ")[0], me ? PEOPLE[otherOf(me)].ad : "", "manitam", "manitama", "sevgilim", "sevgilime"].map(low).filter(x => x && x.length > 1);
  return names.some(n => URe(`(^|\\s)${escRe(n)}`).test(t));
}
// remove dates, times, verbs and names so what is left can serve as a title
function leftover(t, extra = []){
  const drop = [
    U(/\b(bugün|yarın|öbür gün|yarından sonra|haftaya)\S*/g), URe(`\\b(${WEEKDAYS.map(w => w[0]).join("|")})\\S*`, "g"),
    URe(`\\b\\d{1,2} (${MONTHS.join("|")})\\S*`, "g"), U(/\bayın \d+\S*/g), U(/\bsaat\b/g), U(/\b\d{1,2}(:\d{2})?('?\S*)?/g),
    U(/\b(sabah|öğlen|öğle|öğleden sonra|akşam|gece|buçuk)\S*/g), U(/\b(saatlik|dakikalık|kadar|her hafta|her)\b/g),
    U(/\b(ekle|ekler misin|ekleyin|koy|oluştur|kaydet|yaz|planla|ayarla|lütfen|bir|için|ile|ve|olarak|var|takvime|takvimime)\b/g),
    ...extra,

  for (const r of drop) t = t.replace(r, " ");
