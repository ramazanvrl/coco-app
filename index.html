}
// text after a keyword, taken from the original words so casing survives
function textAfter(raw, re){
  const m = low(raw).match(re); if (!m) return "";
  return raw.slice(m.index + m[0].length).replace(/^[\s:,-]+/, "").replace(/^(olarak|ekle|yaz|şöyle)\s+/i, "").trim();
}

const VOICE_HELP = [
  "Yarın saat 6'da Zeynep ile özel seans ekle",
  "Cuma 10'da Anatomi dersi ekle, her hafta",
  "Anatomi sınavı 5 Kasım'da",
  "Bugün ne var? · Yarın ne var? · Bu hafta ne var?",
  "Zeynep'e not: bel ağrısı azaldı",
  "Zeynep geldi (bugünkü seansında yoklama)",
  "Zeynep'in kaç dersi kaldı?",
  "Manitama not: akşam sinemaya gidiyoruz",
  "Hediye fikri: kulaklık",
  "Regl başladı · Regl bitti · Regl ne zaman?",
  "Su içtim · 2 bardak su içtim",
];

function dayReport(d){
  const evs = eventsOn(d), tks = tasksOn(d).filter(x => !x.done), sps = specialsOn(d);
  const when = d === today() ? "Bugün" : d === addDays(today(), 1) ? "Yarın" : capTr(fmtLong(d));
  if (!evs.length && !tks.length && !sps.length) return {lines:[`${when} için kayıt yok.`], say:`${when} için kayıt yok.`};
  const lines = [...evs.map(e => `${e.start}  ${e.title}${e.students.length ? " · " + e.students.map(id => state.students.find(s => s.id === id)?.name.split(" ")[0]).filter(Boolean).join(", ") : ""}`),
    ...tks.map(x => `${x.time ? x.time + "  " : ""}${x.kind === "sinav" ? "Sınav" : "Teslim"}: ${x.title}`), ...sps.map(x => x.t)];
  const say = `${when} ${evs.length ? `${evs.length} planın var. ` + evs.map(e => `Saat ${sayTime(e.start)}'da ${e.title}`).join(". ") : ""}${tks.length ? `. ${tks.map(x => `${x.kind === "sinav" ? "Sınav" : "Teslim"}: ${x.title}${x.time ? `, saat ${sayTime(x.time)}` : ""}`).join(". ")}` : ""}${sps.length ? `. ${sps.map(x => x.t).join(", ")}` : ""}.`;
  return {lines, say};
}

// returns {kind:"answer"|"action"|"unknown", lines, say, run?, edit?}
function interpret(raw){
  const t = normalizeCmd(raw);
  if (!t) return {kind:"unknown"};
  const answer = (lines, say) => ({kind:"answer", lines: [].concat(lines), say: say || [].concat(lines).join(". ")});
  const action = (lines, say, run, edit) => ({kind:"action", lines, say, run, edit});
  const date = parseDate(t), studs = studentsIn(t);

  if (U(/\b(ne yapabilirsin|neler söyleyebilirim|yardım|komutlar)/).test(t)) return answer(VOICE_HELP, "Örnek komutları ekrana yazdım.");

  if (U(/\b(regl|adet)/).test(t)) {
    if (U(/\b(ne zaman|kaç gün|gecik)/).test(t)) {
      const on = ongoing(); if (on) return answer(`Regl ${daysBetween(on.start, today()) + 1}. gün.`);
      const nx = nextPeriod(); if (!nx) return answer("Henüz regl kaydı yok.");
      const n = daysBetween(today(), nx);
      return answer(n > 0 ? `Sonraki regl tahminen ${fmtLong(nx)}, ${n} gün sonra.` : n === 0 ? "Regl bugün bekleniyor." : `Regl ${-n} gün gecikti.`);
    }
    const d = date || today();
    if (U(/\b(bitti|sona erdi|kesildi)/).test(t)) return action([`Regl bitti · ${capTr(fmtLong(d))}`], "Regl bitti olarak işaretleyeyim mi?", () => { reglEnd(d); return "Regl bitişi kaydedildi."; });
    if (U(/\b(başladı|geldi|oldum)/).test(t)) return action([`Regl başladı · ${capTr(fmtLong(d))}`], "Regl başlangıcını kaydedeyim mi?", () => { reglStart(d); return "Regl başlangıcı kaydedildi."; });
  }

  if (U(/\bsu\b/).test(t) && U(/\b(içtim|ekle|bardak|ne kadar|kaç)/).test(t)) {
    const cur = state.water[today()] || 0;
    if (U(/\b(ne kadar|kaç)/).test(t)) return answer(`Bugün ${cur} bardak, ${(cur * GLASS_ML).toLocaleString("tr-TR")} mililitre su içtin.`);
    const m = t.match(U(/\b(\d+) bardak/)), k = m ? +m[1] : 1;
    return action([`${k} bardak su · bugün toplam ${cur + k}`], `${k} bardak su ekleyeyim mi?`, () => { state.water = {[today()]: Math.min(30, cur + k)}; return `Bugün ${cur + k} bardak oldu.`; });
  }

  if (U(/\bhediye/).test(t)) {
    const text = textAfter(raw, /hediye( fikri| fikrim| olarak)?/);
    if (!text) return answer("Hediye fikrini de söyle: Hediye fikri, kulaklık.");
    return action([`Hediye fikri: ${text}`], `Hediye fikri olarak ${text} ekleyeyim mi?`, () => { state.manita.gifts.unshift({id:uid(), text, done:false}); return "Hediye fikri eklendi."; });
  }

  if (U(/(^|\s)(not|notu|notuna|notlarına)(\s|:|$)|\bnot (al|düş|ekle)/).test(t)) {
    const text = textAfter(raw, U(/\bnot(u|una|larına)?( al| düş| ekle)?\b:?/)) || "";
    if (!text) return answer("Notun kendisini de söyle. Örneğin: Zeynep'e not, bel ağrısı azaldı.");
    if (studs.length === 1 && !manitaNamed(t.replace(new RegExp(escRe(low(studs[0].name.split(" ")[0])), "g"), ""))) {
      const s = studs[0];
      return action([`${s.name} için not`, text, capTr(fmtLong(today()))], `${s.name.split(" ")[0]} için notu kaydedeyim mi?`, () => { s.notes.push({id:uid(), date:today(), text}); return "Not öğrencinin sayfasına eklendi."; });
    }
    if (manitaNamed(t)) return action(["Manitam · Notlar ve anılar", text], "Notu Manitam sayfasına kaydedeyim mi?", () => { state.manita.notes.push({id:uid(), date: date || today(), text}); return "Not Manitam sayfasına eklendi."; });
    if (studs.length > 1) return answer(`Birden fazla öğrenci adı duydum: ${studs.map(s => s.name).join(", ")}. Tek bir öğrenciyle söyle.`);
    return answer("Notu kime yazayım? Öğrenci adıyla ya da “Manitama not” diye söyle.");
  }

  if (studs.length && U(/\b(kaç ders|ders(i|leri)? kaldı|paket)/).test(t)) {
    return answer(studs.map(s => { const l = leftOf(s); return l > 0 ? `${s.name}: ${l} ders kaldı.` : `${s.name}: paketi bitti.`; }));
  }

  if (studs.length && U(/\b(geldi|geldiler|katıldı|derse geldi)\b/).test(t)) {
    const d = today(), nowM = new Date().getHours() * 60 + new Date().getMinutes(), lines = [], todo = [];
    for (const s of studs) {
      const evs = eventsOn(d).filter(e => PILATES(e.type) && e.students.includes(s.id));
      if (!evs.length) { lines.push(`${s.name}: bugün kayıtlı olduğu seans yok`); continue; }
      const e = evs.sort((a, b) => Math.abs(toMin(a.start) - nowM) - Math.abs(toMin(b.start) - nowM))[0];
      if ((e.att[d] || []).includes(s.id)) { lines.push(`${s.name}: ${e.start} ${e.title} için zaten işaretli`); continue; }
      lines.push(`${s.name} geldi · ${e.start} ${e.title}`); todo.push([e, s]);
    }
    if (!todo.length) return answer(lines);
    return action(lines, "Yoklamaya işaretleyeyim mi?", () => { for (const [e, s] of todo) e.att[d] = [...(e.att[d] || []), s.id]; return "Yoklama işaretlendi, paketlerden düşüldü."; });
  }

  if (U(/\b(ne var|neler var|programım|programımda|planım|ajandam|ne yapıyorum)/).test(t)) {
    if (U(/\bbu hafta/).test(t)) {
      const ws = mondayOf(today()), lines = [];
      for (let i = 0; i < 7; i++) { const d = addDays(ws, i), evs = eventsOn(d); if (evs.length) lines.push(`${WD[i]}: ${evs.map(e => `${e.start} ${e.title}`).join(", ")}`); }
      return answer(lines.length ? lines : ["Bu hafta kayıt yok."], lines.length ? `Bu hafta ${lines.length} gün planın var.` : "Bu hafta kayıt yok.");
    }
    const r = dayReport(date || today()); return answer(r.lines, r.say);
  }

  const taskKind = U(/\b(sınav|vize|final|bütünleme|quiz)/).test(t) ? "sinav" : U(/\bsunum/).test(t) ? "sunum" : U(/\b(ödev|teslim|rapor)/).test(t) ? "odev" : "";
  if (taskKind && U(/\b(ne zaman|var mı|neler)\b/).test(t)) {
    const open = state.tasks.filter(x => !x.done && x.due >= today()).sort((a, b) => dueKey(a) < dueKey(b) ? -1 : 1);
    const word = leftover(t, [U(/\b(ne zaman|var mı|neler|sınav\S*|vize\S*|final\S*|ödev\S*|sunum\S*|teslim\S*)\b/g)]);
    const hit = word ? open.filter(x => low(x.title + " " + (x.course || "") + " " + (x.note || "")).includes(word.split(" ")[0])) : open.filter(x => taskKind === "sinav" ? x.kind === "sinav" : x.kind !== "sinav");
    if (!hit.length) return answer(word ? `“${word}” ile ilgili yaklaşan kayıt bulamadım.` : "Yaklaşan kayıt yok.");
    return answer(hit.slice(0, 5).map(x => `${x.title}: ${fmtLong(x.due)}${x.time ? " saat " + x.time : ""} (${daysBetween(today(), x.due)} gün)`));
  }
  if (taskKind) {
    const title = capTr(leftover(t, [U(/\b(ekle\S*|var)\b/g)])) || TASKKINDS[taskKind];
    const due = date || addDays(today(), 7), time = parseTime(t)?.start || "";
    const lines = [`${TASKKINDS[taskKind]}: ${title}`, `${capTr(fmtLong(due))}${time ? " · " + time : ""}${date ? "" : " (tarih söylemedin, 1 hafta sonrasına koydum)"}`];
    const data = {title, kind: taskKind, course: "", note: "", due, time};
    return action(lines, `${title}, ${fmtLong(due)}${time ? ` saat ${sayTime(time)}` : ""} olarak ekleyeyim mi?`, () => { state.tasks.push({id:uid(), done:false, ...data}); return "Ödev ve sınavlara eklendi."; }, () => taskSheet(null, taskKind, data));
  }

  const tm = parseTime(t);
  const wantsAdd = U(/\b(ekle|koy|oluştur|kaydet|planla|ayarla|randevu|seans|ders|görüşme|toplantı)/).test(t);
  if (tm || (wantsAdd && date)) {
    let type = "kisisel";
    if (studs.length || U(/\b(seans|pilates|reformer|grup)/).test(t)) type = U(/\bgrup/).test(t) || studs.length > 1 ? "pilates" : "ozel";
    else if (U(/\b(ders|dersi|okul|lab)\b/).test(t)) type = "ders";
    else if (U(/\b(danışan|görüşme|staj|poliklinik)/).test(t)) type = "danisan";
    const nameDrop = studs.map(s => URe(`\\b${escRe(low(s.name.split(" ")[0]))}\\S*`, "g"));
    const typeDrop = type === "ders" ? [U(/\b(dersi|ders)\b/g)] : PILATES(type) ? [U(/\b(özel|seans\S*|pilates|grup|ders\S*)\b/g)] : [];
    const title = capTr(leftover(t, [...nameDrop, ...typeDrop])) || {ozel:"Özel seans", pilates:"Pilates grup", ders:"Ders", danisan:"Görüşme", kisisel:"Kişisel plan"}[type];
    const start = tm ? tm.start : "10:00";
    const end = tm && tm.end ? tm.end : plusMin(start, tm && tm.dur ? tm.dur : PILATES(type) ? 50 : 60);
    const d = date || today();
    const data = {title, type, date:d, start, end, repeat: U(/\bher (hafta|pazartesi|salı|çarşamba|perşembe|cuma|cumartesi|pazar)/).test(t) ? "weekly" : "none", place:"", note:"", students: PILATES(type) ? studs.map(s => s.id) : [], prog:""};
    const lines = [`${TYPES[type].ad}: ${title}`, `${capTr(fmtLong(d))} · ${start}–${end}${data.repeat === "weekly" ? " · her hafta" : ""}`];
    if (data.students.length) lines.push("Öğrenci: " + studs.map(s => s.name).join(", "));
    if (!tm) lines.push("Saat söylemedin, 10:00'a koydum.");
    return action(lines, `${d === today() ? "Bugün" : d === addDays(today(), 1) ? "Yarın" : fmtLong(d)} saat ${sayTime(start)}'da ${title} ekleyeyim mi?`,
      () => { state.events.push({id:uid(), att:{}, skip:[], ...data}); selDay = d; return "Takvime eklendi."; },
      () => eventSheet(null, d, type, data));
  }

  return {kind:"unknown"};
}

const micSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
let rec = null;
function voiceSheet(autoStart){
  openSheet(`
    <div class="head"><h2>Sesli komut</h2>${closeBtn}</div>
    <div class="vmic">${SpeechRec ? `<button type="button" class="micbig" id="v-mic" aria-label="Konuş">${micSvg}</button>` : ""}
      <div class="small muted" id="v-state">${SpeechRec ? "Mikrofona dokun ve konuş" : "Bu tarayıcı sesi doğrudan dinleyemiyor. Klavyedeki mikrofon tuşuyla söyleyebilir ya da yazabilirsin."}</div></div>
    <div class="vheard" id="v-heard" hidden></div>
    <form id="v-form" class="inline"><input class="input" id="v-input" placeholder="ya da yaz: yarın 6'da Zeynep ile seans" autocomplete="off" aria-label="Komut"><button class="btn">Gönder</button></form>
    <div id="v-result"></div>
    <details class="vhelp"><summary>Neler söyleyebilirim?</summary><ul>${VOICE_HELP.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>
    <label class="toggle small"><input type="checkbox" id="v-reply" ${voiceReplyOn() ? "checked" : ""}> Cevapları sesli oku</label>`, sh => {
      const st = sh.querySelector("#v-state"), heard = sh.querySelector("#v-heard"), res = sh.querySelector("#v-result"), mic = sh.querySelector("#v-mic");
      sh.querySelector("#v-reply").addEventListener("change", ev => { lsWrite(VOICE_REPLY, ev.target.checked ? "1" : "0"); if (!ev.target.checked) try { speechSynthesis.cancel(); } catch {} });
      const showResult = r => {
        if (r.kind === "unknown") {
          res.innerHTML = `<div class="vcard"><b>Anlayamadım.</b><div class="small muted">Şöyle deneyebilirsin:</div><ul class="small">${VOICE_HELP.slice(0, 5).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
          speak("Anlayamadım, tekrar söyler misin?"); return;
        }
        if (r.kind === "answer") { res.innerHTML = `<div class="vcard">${r.lines.map(l => `<div>${esc(l)}</div>`).join("")}</div>`; speak(r.say); return; }
        res.innerHTML = `<div class="vcard act"><div class="label">Bunu mu demek istedin?</div>${r.lines.map((l, i) => `<div${i ? "" : ' class="vmain"'}>${esc(l)}</div>`).join("")}
          <div class="actions" style="justify-content:flex-start"><button type="button" class="btn" id="v-ok">Tamam, kaydet</button>${r.edit ? `<button type="button" class="btn ghost" id="v-edit">Düzenle</button>` : ""}<button type="button" class="btn line" id="v-no">Vazgeç</button></div></div>`;
        speak(r.say);
        res.querySelector("#v-ok").addEventListener("click", () => {
          const msg = r.run(); save(); render();
          res.innerHTML = `<div class="vcard done">✓ ${esc(msg)}</div>`; speak(msg);
        });
        const ed = res.querySelector("#v-edit"); ed && ed.addEventListener("click", () => r.edit());
        res.querySelector("#v-no").addEventListener("click", () => { res.innerHTML = ""; try { speechSynthesis.cancel(); } catch {} });
      };
      const handle = text => { heard.hidden = false; heard.textContent = `“${text}”`; showResult(interpret(text)); };
      sh.querySelector("#v-form").addEventListener("submit", ev => { ev.preventDefault(); const v = sh.querySelector("#v-input").value.trim(); if (v) { handle(v); sh.querySelector("#v-input").value = ""; } });
      // iPhone notes: the microphone permission prompt aborts the first session; stopping an old session
      // reports "aborted" on that old object (it must not touch the screen of the new one); and Safari
      // sometimes ends without marking the text final, so the last interim text counts too.
      let retried = false;
      const listen = (isRetry = false) => {
        if (!SpeechRec) return;
        const old = rec; rec = null;
        try { old && old.abort(); } catch {}
        try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch {}
        const r = new SpeechRec(); rec = r;
        r.lang = "tr-TR"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
        let text = "", gotSpeech = false, failed = false;
        const startedAt = Date.now();
        const live = () => rec === r;
        mic.classList.add("on"); st.textContent = "Dinliyorum…"; res.innerHTML = "";
        r.onresult = ev => {
          if (!live()) return;
          let fin = "", interim = "";
          for (const x of ev.results) x.isFinal ? (fin += x[0].transcript) : (interim += x[0].transcript);
          text = (fin || interim).trim(); gotSpeech = gotSpeech || !!text;
          if (text) { heard.hidden = false; heard.textContent = `“${text}”`; }
        };
        r.onerror = ev => {
          if (!live() || ev.error === "aborted" && !gotSpeech && !isRetry && Date.now() - startedAt < 4000) {
            // our own abort, or iOS cutting the first session for the permission prompt: try once more
            if (live() && !retried) { retried = true; failed = true; setTimeout(() => { if (rec === r) listen(true); }, 350); }
            return;
          }
          failed = true; mic.classList.remove("on");
          st.textContent = {
            "not-allowed": "Mikrofon izni verilmedi. Ayarlar > Safari > Mikrofon'dan izin ver ya da yaz.",
            "service-not-allowed": "Ses tanıma kapalı görünüyor. Ayarlar > Genel > Klavye > Dikte'yi aç, sonra tekrar dene.",
            "no-speech": "Ses duyamadım. Tekrar dokunup konuş.",
            "network": "Ses tanıma için internet gerekiyor.",
            "audio-capture": "Mikrofon kullanılamadı. Başka bir uygulama mikrofonu kullanıyor olabilir.",
            "language-not-supported": "Bu telefonda Türkçe ses tanıma yok. Klavyedeki mikrofonla söyleyebilir ya da yazabilirsin.",
            "aborted": "Dinleme yarıda kesildi. Mikrofona tekrar dokun.",
          }[ev.error] || `Dinleyemedim (${ev.error || "bilinmeyen hata"}). Tekrar dene ya da yaz.`;
        };
        r.onend = () => {
          if (!live() || failed && !text) return;
          rec = null; mic.classList.remove("on");
          if (text) { st.textContent = "Mikrofona dokun ve konuş"; handle(text); }
          else st.textContent = "Ses duyamadım. Tekrar dokunup konuş.";
        };
        try { r.start(); } catch (e) { mic.classList.remove("on"); rec = null; st.textContent = `Dinleyemedim (${e && e.name || "başlatılamadı"}). Tekrar dene ya da yaz.`; }
      };
      mic && mic.addEventListener("click", () => { if (mic.classList.contains("on") && rec) { try { rec.stop(); } catch {} } else { retried = false; listen(); } });
      if (autoStart) listen();
    }, true);
}

// ---------- toast ----------
let toastT;
function toast(msg){
  const t = document.getElementById("toastSlot");
  t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => t.innerHTML = "", 2200);
}

// ---------- events ----------
const goTab = t => { tab = t; try { localStorage.setItem("coco.tab", tab); } catch {} render(); window.scrollTo(0,0); };
const focusEl = id => { const el = document.getElementById(id); if (el) { el.scrollIntoView({block:"center"}); el.focus(); } };
document.addEventListener("click", ev => {
  const el = ev.target.closest("button,[data-close-overlay]");
  if (!el) return;
  if (el.matches("[data-close-overlay]") && ev.target !== el) return;
  const d = el.dataset;
  if (d.tab) { goTab(d.tab); return; }
  if ("closeOverlay" in d || "close" in d) { closeSheet(); return; }
  if (d.goto) { if (slot.innerHTML) closeSheet(); goTab(d.goto); return; }
  if (d.openEv) { eventSheet(d.openEv, d.day); return; }
  if (d.newEv !== undefined && el.hasAttribute("data-new-ev")) { eventSheet(null, d.newEv, d.newType); return; }
  if (d.openTask) { taskSheet(d.openTask); return; }
  if (d.newTask) { taskSheet(null, d.newTask); return; }
  if (el.hasAttribute("data-new-stu")) { studentSheet(null); return; }
  if (d.openStu) { studentSheet(d.openStu); return; }
  if (d.viewStu) { studentView(d.viewStu); return; }
  if (d.toggleTask) { const t = state.tasks.find(x => x.id === d.toggleTask); t.done = !t.done; save(); render(); return; }
  if (d.renew) {
    const s = state.students.find(x => x.id === d.renew);
    // a visit already marked today belongs to the old package
    s.start = today(); s.prior = 0;
    for (const e of state.events) if ((e.att[today()]||[]).includes(s.id)) s.prior--;
    delete s.demo; save(); if (slot.innerHTML) closeSheet(); render(); toast(`${s.name} için ${s.pkg} derslik yeni paket başladı`); return;
  }
  if (d.water) { const n = +d.water, cur = state.water[today()] || 0; state.water = {[today()]: cur === n ? n-1 : n}; save(); render(); return; }
  if (d.calmode) { calMode = d.calmode; try { localStorage.setItem("coco.cal", calMode); } catch {} render(); return; }
  if (d.month !== undefined) {
    if (d.month === "0") { monthCursor = today().slice(0,7); selDay = today(); }
    else { const [y,m] = monthCursor.split("-").map(Number); const nd = new Date(y, m-1 + (+d.month), 1); monthCursor = ymd(nd).slice(0,7); }
    render(); return;
  }
  if (d.week !== undefined) { weekStart = d.week === "0" ? mondayOf(today()) : addDays(weekStart, 7 * +d.week); render(); return; }
  if (d.sel) { selDay = d.sel; if (d.sel.slice(0,7) !== monthCursor) monthCursor = d.sel.slice(0,7); render(); return; }
  if (d.stumode) { stuMode = d.stumode; render(); return; }
  if (d.mveq) { mvEq = d.mveq; document.querySelectorAll("[data-mveq]").forEach(c => c.setAttribute("aria-pressed", c.dataset.mveq === mvEq)); drawMoves(); return; }
  if (el.hasAttribute("data-new-move")) { moveSheet(null); return; }
  if (d.openMove) { moveSheet(d.openMove); return; }
  if (el.hasAttribute("data-new-prog")) { programSheet(null); return; }
  if (d.openProg) { programSheet(d.openProg); return; }
  if (d.viewProg) { if (slot.innerHTML) closeSheet(); tab = "ogrenciler"; stuMode = "program"; openProg = d.viewProg; render(); const c = document.getElementById("prog-" + d.viewProg); c && c.scrollIntoView({block:"center"}); return; }
  if (d.copyProg) {
    copyText(progText(progOf(d.copyProg)), "Şablon kopyalandı, mesaja yapıştırabilirsin");
    return;
  }
  if (d.reglStart) { reglStart(d.reglStart); return; }
  if (d.reglEnd) { reglEnd(d.reglEnd); return; }
  if (el.hasAttribute("data-cycles")) { cycleSheet(); return; }
  if (el.hasAttribute("data-edit-manita")) { manitaSheet(); return; }
  if (el.hasAttribute("data-new-mday")) { mdaySheet(null); return; }
  if (d.mday) { mdaySheet(d.mday); return; }
  if (d.giftToggle) { const g = state.manita.gifts.find(x => x.id === d.giftToggle); g.done = !g.done; save(); render(); return; }
  if (d.giftDel) { state.manita.gifts = state.manita.gifts.filter(x => x.id !== d.giftDel); save(); render(); toast("Silindi"); return; }
  if (d.me) { setMe(d.me); render(); return; }
  if (el.hasAttribute("data-me-reset")) { setMe(""); render(); return; }
  if (d.evday) { if (d.evday <= today()) { evalDay = d.evday; render(); } return; }
  if (d.eval) { evalSheet(d.eval, d.day || today()); return; }
  if (d.mnoteDel) { state.manita.notes = state.manita.notes.filter(x => x.id !== d.mnoteDel); save(); render(); toast("Not silindi"); return; }
  if (d.mpick) {
    closeSheet();
    if (d.mpick === "day") mdaySheet(null); else if (d.mpick === "info") manitaSheet(); else focusEl(d.mpick === "gift" ? "gift-text" : "mn-text");
    return;
  }
  if (d.pick === "program") { closeSheet(); stuMode = "ogrenci"; goTab("ogrenciler"); toast("Öğrenciye dokun, haftalık programını hazırla"); return; }
  if (d.pick === "regl") { closeSheet(); cycleSheet(); return; }
  if (d.pick === "mday") { closeSheet(); mdaySheet(null); return; }
  if (d.pick) { closeSheet(); if (d.pick === "task") taskSheet(null, "odev"); else eventSheet(null, tab === "takvim" ? selDay : today(), d.pick); return; }
  if (d.act === "backup") { backupSheet(); return; }
  if (d.act === "push-on") { lsWrite(PUSH_ASKED, "1"); pushEnable().then(render); return; }
  if (d.act === "push-later") { lsWrite(PUSH_ASKED, "1"); render(); toast("Sonra zil simgesinden açabilirsin"); return; }
  if (d.act === "snooze") { lsWrite(BK_SNOOZE, addDays(today(), 7)); render(); return; }

});
document.addEventListener("submit", ev => {
  const f = ev.target;
  if (f.id === "pairForm") {
    ev.preventDefault();
    if (!sync.pairFrom(f.querySelector("#pair-text").value)) toast("Bu bir kurulum linki değil. …/#k= ile başlayan linkin tamamını yapıştır.");
    return;
  }
  if (f.id === "giftForm") {
    ev.preventDefault();
    const text = f.querySelector("#gift-text").value.trim(); if (!text) return;
    state.manita.gifts.unshift({id:uid(), text, done:false}); save(); render(); focusEl("gift-text"); toast("Hediye fikri eklendi");
  } else if (f.id === "mnoteForm") {
    ev.preventDefault();
    const text = f.querySelector("#mn-text").value.trim(); if (!text) return;
    state.manita.notes.push({id:uid(), date: f.querySelector("#mn-date").value || today(), text}); save(); render(); toast("Not kaydedildi");
  }
});
document.getElementById("backupBtn").addEventListener("click", backupSheet);
document.getElementById("bellBtn").addEventListener("click", pushSheet);
pushSync();
document.getElementById("syncPill").addEventListener("click", () => {
  if (sync.key) { sync.run(); toast("Diğer cihazdaki değişikliklere bakılıyor"); }
  else { backupSheet(); setTimeout(() => { const i = document.getElementById("pair-text"); if (i) { i.scrollIntoView({block:"center"}); i.focus(); } }, 50); }
});
// another tab or the home-screen app saved: adopt its data so this tab never writes stale records over it
window.addEventListener("storage", e => {
  if (e.key !== LS || !e.newValue) return;
  try { state = normalize(JSON.parse(e.newValue)); persisted = true; } catch { return; }
  if (slot.innerHTML) { closeSheet(); toast("Başka bir pencerede değişiklik yapıldı, güncel hali yüklendi"); }
  render();
});
document.getElementById("micfab").addEventListener("click", () => voiceSheet(true));
document.getElementById("fab").addEventListener("click", () => {
  if (tab === "gorevler") taskSheet(null, "odev");
  else if (tab === "ogrenciler") stuMode === "program" ? programSheet(null) : stuMode === "hareket" ? moveSheet(null) : studentSheet(null);
  else if (tab === "manitam") manitaChooser();
  else chooser();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && slot.innerHTML) closeSheet(); });

render();
sync.run();
setInterval(() => { if (!slot.innerHTML && tab === "bugun") render(); }, 60000);
})();
</script>
</body>
</html>
