# COCO notifications: every hour, send what is due in the next hour (bildirim/gonder.mjs).
# Published into the coco-app repo as .github/workflows/bildirim.yml by pages-build.mjs.
name: COCO bildirimleri
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bildirim
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --prefix bildirim
      - run: node bildirim/gonder.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
